<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyHerb</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =========================================================================
   0. 공통 — 변수 · 리셋 · 페이지 틀
   ========================================================================= */
:root{
  --ff:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Malgun Gothic',sans-serif;
  --border:#E5E7EB;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#EDEEF1;
  color:#111827;
  font-family:var(--ff);
  -webkit-font-smoothing:antialiased;
}
a{color:#1E3A8A;text-decoration:none}
a:hover{color:#15803D}

/* 페이지 전체를 감싸는 세로 스택. 블록 사이 간격을 여기서 한 번에 조절합니다. */
.page{
  max-width:1200px;
  margin:0 auto;
  padding:40px 24px 72px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* 큰 카드(블록 껍데기)의 공통 모양 */
.card{
  background:#FFFFFF;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}

/* -------- 자주 쓰는 작은 부품들 -------------------------------------------- */
.chip{font:600 11.5px/1 var(--ff);padding:5px 9px;
  border-radius:999px;border:1px solid}
.tag{font:700 10px/1.35 var(--ff);padding:4px 7px;border-radius:6px;
  border:1px solid transparent;display:inline-block;white-space:nowrap;flex:none}
.bigchip{font:700 12.5px/1 var(--ff);padding:7px 12px;
  border-radius:999px;border:1px solid transparent}
.h2{font:700 20px/1.3 var(--ff)}
.h3{font:700 16px/1.3 var(--ff)}
.sub{font:400 12.5px/1.6 var(--ff);color:#6B7280;text-wrap:pretty}
.link{font:600 12px/1.4 var(--ff)}
.note-s{font:400 11.5px/1.7 var(--ff);color:#9CA3AF}
.b{font-weight:600} .right{text-align:right}

/* 빈 상태 카드 — 데이터가 없을 때 그 자리에 대신 들어갑니다 */
.empty{
  border:1px dashed #D8DCE2;border-radius:10px;background:#FFFFFF;
  padding:14px 13px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;
}
.empty.plain{border:none;padding:22px 20px}   /* 섹션 통째로 비었을 때 */
.empty-t{font:600 13px/1.4 var(--ff);color:#4B5563}
.empty-d{font:400 11.5px/1.6 var(--ff);color:#9CA3AF}

/* 접기/펼치기 버튼 (<details> 의 요약 줄에 들어갑니다) */
.toggle{
  font:600 13px/1.4 var(--ff);padding:9px 14px;border-radius:10px;
  border:1px solid #C7CDD6;background:#FFFFFF;
  color:#1F2937;flex:none;white-space:nowrap;
}
.toggle .on{display:inline} .toggle .off{display:none}
details:not([open]) .toggle .on{display:none}
details:not([open]) .toggle .off{display:inline}


/* =========================================================================
   [블록 1] 프로필 헤더
   구조:  요약 줄(아바타 + 이름 + 태그 + 접기버튼)
          └ 펼침 영역 = 3열(검진 결과 / 복약 정보 / 등록한 영양제) + 링크 줄
   ========================================================================= */
.hd{overflow:hidden}
.hd-sum{list-style:none;display:flex;align-items:flex-start;
  justify-content:space-between;gap:24px;padding:22px 24px;cursor:pointer}
.hd-sum::-webkit-details-marker{display:none}
.hd-left{display:flex;gap:16px;align-items:flex-start}
.avatar{width:56px;height:56px;border-radius:50%;background:#E8EBF2;
  border:1px solid #D3D9E6;display:flex;align-items:center;justify-content:center;
  font:700 18px/1 var(--ff);color:#1E3A8A;flex:none}
.hd-info{display:flex;flex-direction:column;gap:8px}
.hd-name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hd-name .nm{font:700 22px/1.2 var(--ff)}
.hd-name .mt{font:400 13px/1.4 var(--ff);color:#6B7280}
.tags{display:flex;flex-wrap:wrap;gap:6px}

.hd-body{border-top:1px solid var(--border);background:#FAFBFC;
  padding:22px 24px;display:flex;flex-direction:column;gap:16px}
/* 헤더 3열. 열 수는 tokens.LAYOUT["header_cols"] 로 정합니다. */
.hd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.hd-col{display:flex;flex-direction:column;gap:10px}
.hd-col-t{font:700 13px/1.4 var(--ff);color:#111827}
.hd-links{display:flex;gap:18px;flex-wrap:wrap;
  border-top:1px dashed #E1E4E9;padding-top:12px}

/* 검진 결과 표 — 열 너비 비율을 여기서 조절합니다 */
.tbl{border:1px solid var(--border);border-radius:10px;
  background:#FFFFFF;overflow:hidden}
.tr{display:grid;grid-template-columns:1.25fr .85fr .95fr .62fr;gap:6px;
  padding:8px 10px;font:400 11.5px/1.5 var(--ff);
  border-top:1px solid #F1F2F4;align-items:center}
.tr.th{font:600 11px/1.4 var(--ff);color:#6B7280;
  background:#F3F4F6;border-top:none}
.tr .b{white-space:nowrap}
.tr .rf{color:#6B7280}

/* [추가] 검진 표를 목표질환별로 나누는 구분줄 */
.tr.gp{background:#FAFBFC;font:700 10.5px/1.4 var(--ff);color:#9CA3AF;
  grid-template-columns:1fr;letter-spacing:.04em}
/* [추가] 검진 전체 표를 감싸는 접이식 영역 */
.exam summary{list-style:none}
.exam summary::-webkit-details-marker{display:none}

/* 복약 / 영양제 목록의 작은 줄 */
.rows{display:flex;flex-direction:column;gap:8px}
.row{border:1px solid var(--border);border-radius:10px;background:#FFFFFF;
  padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.top{align-items:flex-start}
.row-l{display:flex;flex-direction:column;gap:3px}
.row-t{font:600 12.5px/1.4 var(--ff)}
.row-d{font:400 11.5px/1.4 var(--ff);color:#6B7280}


/* =========================================================================
   [블록 2] 섭취량
   구조:  제목 + 범례 / 탭 / 본문
          본문은 데이터에 따라 둘 중 하나 → 성분 카드 그리드  또는  안내 블록
   ========================================================================= */
.intake{display:flex;flex-direction:column;gap:14px}
.in-head{display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;flex-wrap:wrap}
.in-head-l{display:flex;flex-direction:column;gap:6px;max-width:720px}

.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  font:500 11.5px/1.4 var(--ff);color:#4B5563}
.legend span{display:flex;align-items:center;gap:5px}
.legend .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend .ln{width:2px;height:12px;display:inline-block}

/* --- 탭 (권장 대비 / 상한 대비) -------------------------------------------
   JavaScript 없이 동작합니다. 숨겨진 radio 두 개 + CSS 형제 선택자 조합입니다.
   한 페이지에 리포트를 여러 개 넣을 때를 대비해 id 에 uid 를 붙입니다.        */
.tabs{display:inline-flex;align-self:flex-start;padding:3px;
  background:#E8EAEE;border-radius:10px;gap:3px}
.tabs label{font:500 12.5px/1.4 var(--ff);padding:8px 16px;border-radius:8px;
  color:#6B7280;cursor:pointer}
.tabin{position:absolute;opacity:0;pointer-events:none}
.tabin[value=rda]:checked~.intake .tabs .lb-rda,
.tabin[value=ul]:checked~.intake .tabs .lb-ul{
  background:#FFFFFF;color:#111827;font-weight:700;
  box-shadow:0 1px 2px rgba(16,24,40,.08)}

/* 탭에 대응하는 두 화면(pane). 선택된 쪽만 보입니다. */
.pane{display:none;flex-direction:column;gap:16px}
.pane.always{display:flex}            /* 탭이 필요 없는 상태(안내 블록)일 때 */
.tabin[value=rda]:checked~.intake .pane-rda,
.tabin[value=ul]:checked~.intake .pane-ul{display:flex}

/* 성분 카드 그리드. 열 수는 data-cols 속성으로 지정됩니다(카드 개수에 따라 자동). */
.grid{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}
.grid[data-cols="1"]{grid-template-columns:repeat(1,1fr)}
.grid[data-cols="2"]{grid-template-columns:repeat(2,1fr)}
.grid[data-cols="3"]{grid-template-columns:repeat(3,1fr)}
.grid[data-cols="4"]{grid-template-columns:repeat(4,1fr)}

/* --- 성분 카드 ------------------------------------------------------------
   위에서부터: 이름+배지 / 캡션 / 반원 게이지 / 등급 / 막대 / 수치 / 코멘트    */
.nc{background:#FFFFFF;border:1px solid var(--border);
  border-radius:14px;padding:18px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
  display:flex;flex-direction:column;gap:12px}
.nc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nc-name{font:700 18px/1.3 var(--ff)}
.nc-cap{font:500 11.5px/1.4 var(--ff);padding:5px 9px;
  border-radius:7px;display:inline-block}
.gauge{width:100%;max-width:190px;margin:2px auto 0;display:block}
.nc-level{text-align:center;font:700 13px/1.4 var(--ff);margin-top:-4px}

/* 막대 + 마커. barwrap 이 좌표 기준이고 마커는 % 위치로 절대배치됩니다. */
.barwrap{position:relative;height:40px}
.bar{position:absolute;left:0;right:0;top:20px;height:10px;
  border-radius:5px;background:#F3F4F6;
  display:flex;overflow:hidden}
.mk{position:absolute;top:12px;height:26px;width:2px;display:block}
.mk-rda{background:#15803D}
.mk-ul{background:#DC2626;transform:translateX(-2px)}
.mkl{position:absolute;top:0;font:700 9.5px/1 var(--ff);font-style:normal}
.mkl-rda{color:#15803D;transform:translateX(-50%)}
.mkl-ul{color:#DC2626;right:0}

.nc-vals{display:flex;justify-content:space-between;gap:8px;
  font:500 11.5px/1.4 var(--ff);color:#4B5563;margin-top:-6px}
.nc-note{border:1px solid;border-radius:9px;padding:10px 11px;
  font:400 12px/1.6 var(--ff);text-wrap:pretty}
.nc-note b{font-weight:700}

/* --- 안내 블록 (성분 카드가 없을 때 그 자리에 들어갑니다) -------------------- */
.guide{border:1px solid #F5C9A4;background:#FFF8F2;border-radius:14px;
  padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.guide-t{font:700 17px/1.3 var(--ff);color:#9A3412}
.guide-d{margin:0;font:400 13.5px/1.8 var(--ff);color:#7C2D12;
  max-width:900px;text-wrap:pretty}

/* 안내 카드들 — 헤더와 같은 3열 그리드를 재사용합니다 */
.opts{display:grid;grid-template-columns:repeat(3,1fr);
  gap:16px}
.opt{background:#FFFFFF;border:1px solid var(--border);
  border-top:4px solid #9CA3AF;border-radius:14px;padding:20px;
  display:flex;flex-direction:column;gap:12px;align-items:flex-start;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.opt-t{font:700 17px/1.3 var(--ff)}
.opt-d{margin:0;font:400 13px/1.7 var(--ff);color:#4B5563}
.btn{margin-top:auto;align-self:stretch;text-align:center;
  font:700 13.5px/1.4 var(--ff);padding:12px 16px;border-radius:10px;color:#fff!important}

/* 안내 카드 안의 숫자 타일 (예: 계산으로 알 수 있는 값) */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{border:1px solid var(--border);border-radius:10px;padding:12px;
  display:flex;flex-direction:column;gap:4px}
.stat-l{font:600 11px/1.4 var(--ff);color:#6B7280}
.stat-v{font:800 22px/1.2 var(--ff);color:#111827}
.stat-v em{font:600 12px/1 var(--ff);color:#6B7280;font-style:normal}
.opt-hold{background:#F3F4F6;border-radius:9px;padding:11px;
  font:400 12px/1.6 var(--ff);color:#6B7280;width:100%}

/* 그리드 아래 가로로 눕는 보조 카드 (예: 추가 등록 유도) */
.wide{background:#FFFFFF;border:1px dashed #C7CDD6;
  border-radius:14px;padding:18px 20px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
.wide .btn{margin:0;align-self:center;flex:none;padding:12px 18px}


/* =========================================================================
   [블록 3] 상호작용 · 성분 중복 점검
   구조:  제목 줄(접기 가능) + 행 목록 (없으면 빈 상태)
   ========================================================================= */
.ix-sum{list-style:none;display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid #F1F2F4;cursor:pointer}
.ix-sum::-webkit-details-marker{display:none}
.ix-row{display:flex;align-items:center;gap:14px;padding:14px 20px;
  border-bottom:1px solid #F5F6F7}
.ix-kind{font:700 10.5px/1.4 var(--ff);padding:5px 8px;border-radius:6px;
  flex:none;min-width:96px;text-align:center;white-space:nowrap}
.ix-text{font:400 13px/1.5 var(--ff);flex:1}
.ix-foot{padding:12px 20px;border-top:1px solid #F5F6F7}


/* =========================================================================
   [블록 4] 종합 소견
   ========================================================================= */
.sm{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.sm-text{margin:0;font:400 14px/1.8 var(--ff);color:#1F2937;
  max-width:900px;text-wrap:pretty}
.sm-keys{display:flex;flex-direction:column;gap:8px}
.sm-keys-l{font:700 11.5px/1.4 var(--ff);color:#6B7280}
.sm-keys-r{display:flex;flex-wrap:wrap;gap:8px}


/* =========================================================================
   [블록 5] 푸터
   ========================================================================= */
.ft{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.ft p{margin:0;font:400 12px/1.7 var(--ff);color:#9CA3AF;
  max-width:1000px;text-wrap:pretty}


/* =========================================================================
   인쇄 — 탭과 버튼을 숨기고 두 pane 을 모두 펼칩니다. 필요 없으면 지우세요.
   ========================================================================= */
@media print{
  .tabs,.toggle{display:none}
  .pane{display:flex!important}
}


/* =========================================================================
   [추가] 리포트 → 입력 화면 이동 링크
   ========================================================================= */
.hd-col-t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.link.edit{font:600 11.5px/1.4 var(--ff);color:#1E3A8A;flex:none;white-space:nowrap}
.link.edit::before{content:'✎ ';font-size:10px}
.link.edit:hover{color:#15803D}

/* 이동한 섹션을 잠깐 강조합니다 */
.fm-focus{outline:2px solid #1E3A8A;outline-offset:2px;
  transition:outline-color .4s ease}
@media (prefers-reduced-motion:reduce){.fm-focus{transition:none}}

/* =========================================================================
   [블록 0] 입력 화면 — 사용자가 처음 만나는 화면입니다.
   리포트와 같은 토큰(--ff, --border, --radius)을 씁니다.
   ========================================================================= */
.intro{padding:26px 24px;display:flex;flex-direction:column;gap:8px}
.intro .h1{font:800 24px/1.3 var(--ff)}
.intro .sub{max-width:640px}
.intro-steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.intro-steps span{font:600 11.5px/1 var(--ff);color:#6B7280;
  background:#F3F4F6;border-radius:999px;padding:6px 10px}

.fm{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.fm-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fm-opt{font:500 11.5px/1.4 var(--ff);color:#9CA3AF}

.fm-row{display:flex;gap:10px;flex-wrap:wrap}
.fm-f{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}
.fm-f>span{font:600 11px/1.3 var(--ff);color:#6B7280}
.fm input[type=text],.fm input[type=number],.fm input[type=date],.fm select{
  font:500 13px/1.4 var(--ff);color:#111827;font-family:var(--ff);
  padding:10px 11px;border:1px solid #D8DCE2;border-radius:9px;
  background:#FFFFFF;width:100%}
.fm input:focus,.fm select:focus{outline:2px solid #1E3A8A;outline-offset:-1px;border-color:#1E3A8A}
.fm input::placeholder{color:#C7CDD6}

/* 목표질환별 접이식 그룹 */
.fm-grp{border:1px solid var(--border);border-radius:10px;background:#FCFCFD}
.fm-grp+.fm-grp{margin-top:7px}
.fm-grp>summary{list-style:none;cursor:pointer;padding:12px 14px;
  font:600 13px/1.4 var(--ff);color:#374151;display:flex;align-items:center;gap:10px}
.fm-grp>summary::-webkit-details-marker{display:none}
.fm-grp>summary::after{content:'펼치기';margin-left:auto;font:600 11px/1 var(--ff);color:#9CA3AF}
.fm-grp[open]>summary::after{content:'접기'}
.fm-grp>summary:hover{background:#F6F8FD;border-radius:10px}
.fm-grp .cnt{font:700 10px/1 var(--ff);color:#1E3A8A;background:#EAEFF9;
  padding:5px 7px;border-radius:6px;opacity:0}
.fm-grp .cnt.on{opacity:1}
.fm-grpbody{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.fm-item>.nm{font:600 11.5px/1.4 var(--ff);color:#6B7280;display:block;margin-bottom:5px}

/* 개수가 정해지지 않은 입력 묶음 (약 · 영양제) */
.fm-card{border:1px solid var(--border);border-radius:12px;padding:13px;
  background:#FCFCFD;display:flex;flex-direction:column;gap:9px}
.fm-card+.fm-card{margin-top:9px}
.fm-cardtop{display:flex;gap:8px;align-items:center}
.fm-cardtop input{flex:1}
.fm-ing{display:grid;grid-template-columns:1fr 92px 96px 34px;gap:6px;align-items:center}
.fm-inglab{display:grid;grid-template-columns:1fr 92px 96px 34px;gap:6px;
  font:600 10.5px/1 var(--ff);color:#9CA3AF;padding:0 2px}
.fm-x{width:34px;height:38px;flex:none;border:1px solid var(--border);border-radius:8px;
  background:#FFFFFF;color:#9CA3AF;font:600 16px/1 var(--ff);cursor:pointer;padding:0}
.fm-x:hover{background:#FDECEC;border-color:#F7D4D4;color:#DC2626}
.fm-add{font:700 12.5px/1.4 var(--ff);color:#1E3A8A;background:#FFFFFF;
  border:1px dashed #C7CDD6;border-radius:10px;padding:11px;cursor:pointer;width:100%}
.fm-add:hover{background:#F6F8FD;border-color:#1E3A8A}
.fm-add.sm{font:600 11.5px/1.4 var(--ff);border:none;background:none;
  padding:2px 0;width:auto;text-align:left}
.fm-add.sm:hover{color:#15803D;background:none}

/* 만성질환 선택 */
.fm-tags{display:flex;flex-wrap:wrap;gap:6px}
.fm-tag{font:500 12px/1 var(--ff);border:1px solid var(--border);border-radius:999px;
  padding:9px 13px;cursor:pointer;background:#FFFFFF;color:#6B7280}
/* 체크박스는 눈에서만 감춥니다. display:none 으로 지우면 키보드 Tab 으로
   선택할 수 없게 되어 키보드만 쓰는 사용자가 이 항목을 건너뛰게 됩니다. */
.fm-tag input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.fm-tag:focus-within{outline:2px solid #1E3A8A;outline-offset:2px}
.fm-tag:hover{background:#F6F8FD}
.fm-tag.on{border-color:#DC2626;background:#FDECEC;color:#DC2626;font-weight:700}
/* '식사 평균도 함께 계산'은 질환 선택이 아니라 단순 옵션이므로 붉게 칠하지 않습니다 */
#meal-wrap.on{border-color:#1E3A8A;background:#EAEFF9;color:#1E3A8A}

/* 하단 고정 바 — 입력 요약과 다음 단계 */
.fm-bar{position:sticky;bottom:0;z-index:5;background:#FFFFFF;
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 -2px 12px rgba(16,24,40,.06);
  padding:14px 20px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
.fm-sum{display:flex;flex-direction:column;gap:3px}
.fm-sum b{font:700 13px/1.4 var(--ff)}
.fm-go{font:700 14px/1.4 var(--ff);color:#FFFFFF;background:#1E3A8A;
  border:none;border-radius:10px;padding:14px 26px;cursor:pointer;flex:none}
.fm-go:hover{background:#152B66}
.fm-go:disabled{background:#D8DCE2;color:#FFFFFF;cursor:not-allowed}

/* 리포트 상단으로 돌아가는 줄 */
.rp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rp-back{font:600 12.5px/1.4 var(--ff);color:#1E3A8A;background:#FFFFFF;
  border:1px solid #C7CDD6;border-radius:9px;padding:9px 14px;cursor:pointer}
.rp-back:hover{background:#F6F8FD;border-color:#1E3A8A}

@media (max-width:640px){
  .fm-go{width:100%}
}
@media print{.fm-bar,.rp-top{display:none}}


/* =========================================================================
   [블록 -1] 상태 화면 — 불러오는 중 / 분석 중 / 실패
   판정을 백엔드(AI)가 하므로 응답까지 몇 초가 걸립니다.
   그동안 보여 줄 화면이 반드시 있어야 합니다.
   ========================================================================= */
.state{min-height:70vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:40px 24px}
.state .h1{font:800 21px/1.4 var(--ff)}
.state .sub{max-width:430px;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;
  border:3px solid #E1E4E9;border-top-color:#1E3A8A;
  animation:spin 850ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* 분석 중 단계 표시 — 진행 중인 단계만 진하게 */
.steps{display:flex;flex-direction:column;gap:7px;margin:6px 0 0;padding:0;text-align:left}
.steps li{list-style:none;font:500 12.5px/1.5 var(--ff);color:#C7CDD6;
  display:flex;align-items:center;gap:8px;transition:color .3s ease}
.steps li::before{content:'○';font-size:10px}
.steps li.on{color:#1F2937;font-weight:600}
.steps li.on::before{content:'◉';color:#1E3A8A}
.steps li.done{color:#15803D}
.steps li.done::before{content:'✓';color:#15803D}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn-line{font:600 13px/1.4 var(--ff);padding:11px 18px;border-radius:10px;
  border:1px solid #C7CDD6;background:#FFFFFF;color:#1F2937;cursor:pointer}
.btn-line:hover{background:#F6F8FD;border-color:#1E3A8A;color:#1E3A8A}
.btn-solid{font:700 13px/1.4 var(--ff);padding:11px 20px;border-radius:10px;
  border:none;background:#1E3A8A;color:#FFFFFF;cursor:pointer}
.btn-solid:hover{background:#152B66}
.errbox{border:1px solid #F7D4D4;background:#FDECEC;border-radius:10px;
  padding:11px 13px;font:400 11.5px/1.6 var(--ff);color:#991B1B;
  max-width:520px;text-align:left;word-break:break-word}

/* =========================================================================
   [블록 -2] 알림 띠 — 예시 기준값 경고 · 샘플 리포트 표시
   ========================================================================= */
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-radius:var(--radius);padding:12px 18px;font:500 12.5px/1.6 var(--ff)}
.banner.warn{background:#FFF8F2;border:1px solid #F5C9A4;color:#9A3412}
.banner.info{background:#EAEFF9;border:1px solid #CBD8F0;color:#1E3A8A}
.banner b{font-weight:700}
.banner .btn-line{margin-left:auto;padding:8px 14px;font-size:12px}

/* =========================================================================
   [블록 0-A] 히어로 — 첫 화면 맨 위
   ========================================================================= */
.hero{padding:30px 26px;display:flex;flex-direction:column;gap:10px}
.hero .h1{font:800 25px/1.35 var(--ff);max-width:640px;text-wrap:pretty}
.hero .sub{max-width:600px;font-size:13px}
.hero-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hero-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.hero-meta span{font:500 11.5px/1.5 var(--ff);color:#6B7280;
  display:flex;align-items:center;gap:5px}

/* =========================================================================
   [블록 0-B] 입력 섹션 — 접이식 껍데기
   선택 섹션은 접힌 채로 시작해, 첫 화면에서 폼이 짧아 보이게 합니다.
   ========================================================================= */
.sec{overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;padding:18px 24px;
  display:flex;align-items:center;gap:12px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:#FAFBFC}
.sec-n{width:24px;height:24px;border-radius:50%;flex:none;
  background:#EAEFF9;color:#1E3A8A;font:700 12px/24px var(--ff);text-align:center}
.sec[open] .sec-n{background:#1E3A8A;color:#FFFFFF}
.sec-t{font:700 15px/1.3 var(--ff)}
.sec-req{font:700 10px/1.35 var(--ff);padding:4px 7px;border-radius:6px;
  background:#FDECEC;color:#DC2626;flex:none}
.sec-opt{font:500 11.5px/1.4 var(--ff);color:#9CA3AF;flex:none}
.sec-state{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.sec-badge{font:700 10.5px/1.35 var(--ff);padding:5px 8px;border-radius:6px;
  background:#EAF6EE;color:#15803D;white-space:nowrap}
.sec-arrow{font:600 11px/1 var(--ff);color:#9CA3AF;white-space:nowrap}
.sec[open] .sec-arrow::after{content:'접기'}
.sec:not([open]) .sec-arrow::after{content:'펼치기'}
.sec-body{border-top:1px solid var(--border);padding:20px 24px 24px;
  display:flex;flex-direction:column;gap:14px}

/* 성분 인식 표시 — 입력하는 순간 기준 유무를 알려 줍니다 */
.ing-flag{font:600 10px/1.35 var(--ff);padding:4px 6px;border-radius:5px;
  white-space:nowrap;align-self:center;text-align:center}
.ing-flag.ok{background:#EAF6EE;color:#15803D}
.ing-flag.no{background:#F3F4F6;color:#9CA3AF}
.ing-flag.idle{visibility:hidden}
.fm-ing,.fm-inglab{grid-template-columns:1fr 84px 88px 60px 34px}

/* 저장 상태 */
.savestate{font:500 11.5px/1.4 var(--ff);color:#9CA3AF;
  display:flex;align-items:center;gap:6px}
.savestate.ok{color:#15803D}
.savestate.err{color:#DC2626}

/* 리포트 상단 액션 */
.rp-acts{display:flex;gap:8px;flex-wrap:wrap}

/* =========================================================================
   [블록 2-B] 추천 영양제
   구조:  제목 + 근거 설명 / 성분 타일 목록 / 주의 문구
   ========================================================================= */
.rc{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.rc-head{display:flex;flex-direction:column;gap:6px}
.rc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rc-item{border:1px solid var(--border);border-left:4px solid #9CA3AF;
  border-radius:12px;padding:14px 15px;background:#FFFFFF;
  display:flex;flex-direction:column;gap:7px}
.rc-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rc-name{font:700 16px/1.3 var(--ff)}
.rc-amt{font:700 12px/1.3 var(--ff);flex:none}
.rc-why{margin:0;font:400 12px/1.65 var(--ff);color:#4B5563;text-wrap:pretty}
.rc-caution{font:600 11.5px/1.6 var(--ff);color:#C2410C;
  background:#FFF1E8;border:1px solid #FBD3B8;border-radius:8px;padding:8px 10px}
.rc-advice{border:1px solid #F7D4D4;background:#FDECEC;border-radius:10px;
  padding:12px 14px;font:600 12.5px/1.7 var(--ff);color:#991B1B;text-wrap:pretty}
.rc-note{font:400 11.5px/1.7 var(--ff);color:#9CA3AF;text-wrap:pretty}
.rc-none{border:1px dashed #C3E5CE;background:#F7FCF9;border-radius:12px;
  padding:18px 20px;font:500 13px/1.7 var(--ff);color:#14532D}

@media (max-width:900px){ .rc-grid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:640px){ .rc-grid{grid-template-columns:1fr} }

@media (max-width:640px){
  .fm-ing,.fm-inglab{grid-template-columns:1fr 66px 70px 50px 34px}
  .sec>summary{padding:16px 18px;flex-wrap:wrap}
  .sec-body{padding:16px 18px 20px}
  .hero{padding:24px 20px}
  .hero .h1{font-size:21px}
}
@media print{.banner,.state,.rp-acts{display:none}}

/* =========================================================================
   [블록 -3] 상단바 — 로그인한 사용자만 봅니다
   로그인 전에는 hidden 이라 화면에 아예 없습니다(계정 메뉴를 보여줄 계정이
   없으니까요). #app 과 별도로 관리해서, 화면(입력→분석중→리포트)이
   바뀌어도 상단바는 다시 그리지 않습니다.
   ========================================================================= */
#topbar{position:sticky;top:0;z-index:20;background:#FFFFFF;
  border-bottom:1px solid var(--border)}
#topbar:not([hidden]){display:block}
.tb-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:56px;
  display:flex;align-items:center;justify-content:space-between}
.tb-acct{position:relative}
.tb-guest{display:flex;gap:8px;align-items:center}
.tb-name{font:600 13px/1.4 var(--ff);color:#374151;background:none;
  border:none;cursor:pointer;padding:8px 4px;display:flex;align-items:center;gap:4px}
.tb-name:hover{color:#1E3A8A}
.tb-menu{position:absolute;right:0;top:calc(100% + 4px);background:#FFFFFF;
  border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.12);
  min-width:140px;padding:6px;flex-direction:column;z-index:21}
.tb-menu[hidden]{display:none}
.tb-menu:not([hidden]){display:flex}
.tb-menu a{font:500 13px/1.4 var(--ff);color:#374151;padding:9px 10px;
  border-radius:7px;text-decoration:none}
.tb-menu a:hover{background:#F6F8FD;color:#1E3A8A}

/* =========================================================================
   [블록 -4] 로그인 · 회원가입 모달
   로그인하기 전에는 반드시 이 모달을 거쳐야 합니다. 배경(scrim)을 눌러도
   닫히지 않습니다 — 선택이 아니라 통과해야 하는 관문이기 때문입니다.
   ========================================================================= */
.modal-scrim{position:fixed;inset:0;background:rgba(17,24,39,.5);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  overflow-y:auto}
.modal-card{background:#FFFFFF;border-radius:var(--radius);max-width:400px;width:100%;
  padding:28px 26px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 20px 60px rgba(16,24,40,.28);margin:auto}
.modal-card .h2{display:block}
.modal-card .sub{display:block;margin-top:6px}
#app[inert]{filter:blur(1.5px);user-select:none}

/* =========================================================================
   [블록 -5] 지난 리포트 목록
   ========================================================================= */
.hist-list{display:flex;flex-direction:column;gap:10px}
.hist-card{background:#FFFFFF;border:1px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap}
.hist-l{display:flex;flex-direction:column;gap:6px;min-width:0}
.hist-date{font:700 13.5px/1.4 var(--ff)}
.hist-sum{font:400 12px/1.5 var(--ff);color:#6B7280}
.hist-badges{display:flex;gap:6px;flex-wrap:wrap}

@media print{#topbar{display:none}}

/* =========================================================================
   [블록 -10] 대화형 입력
   ========================================================================= */
.mode-toggle{display:inline-flex;gap:3px;padding:3px;background:#E9ECF2;
  border-radius:11px;align-self:flex-start}
.mode-btn{font:600 12.5px/1.4 var(--ff);padding:8px 14px;border-radius:8px;
  border:none;background:none;color:#6B7280;cursor:pointer}
.mode-btn.on{background:#FFFFFF;color:#1E3A8A;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.mode-btn:not(.on):hover{color:#374151}

/* 채팅창은 정해진 크기를 유지합니다 — 안의 질문이 버튼 몇 개짜리든
   여러 줄짜리 카드(검진 결과·성분 입력)든, 카드 전체 높이는 늘 같고
   입력칸(.chat-input-area)은 언제나 카드 맨 아래 같은 자리에 있습니다.
   대화 목록(.chat-log)만 flex:1 로 남은 공간을 차지하며 안에서 스크롤됩니다. */
.chat-card{padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;
  height:min(640px,78vh)}
.chat-headrow{display:flex;align-items:flex-start;justify-content:space-between;
  gap:12px;flex-wrap:wrap;flex:none}
.chat-tools{display:flex;gap:6px;flex-wrap:wrap}
.chat-tool-btn{font:600 12px/1.3 var(--ff);padding:7px 11px;border-radius:8px;
  border:1px solid var(--border);background:#FFFFFF;color:#6B7280;cursor:pointer}
.chat-tool-btn:hover{color:#374151;border-color:#9CA3AF}
.chat-tool-btn.danger{color:#B91C1C;border-color:#F3D2D2}
.chat-tool-btn.danger:hover{background:#FDECEC;border-color:#DC2626}
.chat-log{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;
  overflow-y:auto;padding:2px 2px 4px}
.chat-msg{display:flex}
.chat-msg.user{justify-content:flex-end}
.chat-bubble{font:400 13.5px/1.55 var(--ff);padding:10px 14px;border-radius:14px;
  max-width:min(480px,80%);white-space:pre-wrap;word-break:break-word}
.chat-msg.bot .chat-bubble{background:#F1F3F7;color:#111827;border-bottom-left-radius:4px}
.chat-msg.user .chat-bubble{background:#1E3A8A;color:#FFFFFF;border-bottom-right-radius:4px}

/* 입력칸이 있는 아래쪽 영역 — 카드 안에서 늘 같은 위치(로그 바로 아래)에
   고정되고, 내용이 긴 위젯(검진 카드 등)은 이 영역 안에서만 스크롤되어
   카드 전체 크기에는 영향을 주지 않습니다. */
.chat-input-area{flex:none;border-top:1px solid var(--border);padding-top:14px;
  max-height:280px;overflow-y:auto}
.chat-confirm{display:flex;flex-direction:column;gap:10px;background:#FDECEC;
  border:1px solid #F3B4B4;border-radius:12px;padding:14px 16px}
.chat-confirm .sub2{font:600 13px/1.5 var(--ff);color:#7F1D1D}

.chat-inputrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chat-textin{flex:1;min-width:160px;font:400 13.5px/1.4 var(--ff);
  border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.chat-textin:focus{outline:2px solid #1E3A8A;outline-offset:-1px;border-color:#1E3A8A}
.chat-textin.err{border-color:#DC2626;background:#FDECEC}
.chat-textin.err::placeholder{color:#DC2626}
.chat-chips{gap:8px}
.chip-btn{font:600 13px/1.4 var(--ff);border:1px solid var(--border);border-radius:999px;
  padding:9px 15px;background:#FFFFFF;color:#374151;cursor:pointer}
.chip-btn:hover{background:#F6F8FD;border-color:#1E3A8A;color:#1E3A8A}
.chip-btn.on{border-color:#1E3A8A;background:#EAEFF9;color:#1E3A8A;font-weight:700}
.chat-sendrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chat-card-inline{margin:0}
.chat-summary{display:flex;flex-wrap:wrap;gap:8px}
.btn-solid.sm{padding:9px 16px;font-size:12.5px}
.btn-line.sm{padding:9px 16px;font-size:12.5px}

/* 선택형 질문 아래 붙는 '문장으로 답하기' 한 줄 — 버튼과 구분되도록
   점선으로 살짝 떼어 둡니다. */
.chat-freerow{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.chat-fieldnote{display:block;margin:8px 0}

@media print{.mode-toggle{display:none}}

/* =========================================================================
   [블록 -11] 메인(홈) 화면 — 상단바의 서비스 이름을 누르면 여기로 옵니다.
   -------------------------------------------------------------------------
   서비스의 메인 색: 짙은 남색 → 파란색 → 하늘색으로 이어지는 그라데이션에
   흰색을 더해 '고급스러운 파랑·하늘색·흰색' 톤을 만듭니다. 나머지 화면
   (입력·리포트 등)의 실용적인 톤은 그대로 두고, 첫인상을 주는 메인 화면만
   더 공들여 꾸밉니다.
   ========================================================================= */
.tb-logo-btn{font:800 16px/1 var(--ff);color:#1E3A8A;background:none;
  border:none;padding:4px 2px;cursor:pointer}
.tb-logo-btn:hover{color:#15803D}

.home-page{gap:24px}

/* ---- 히어로: 그라데이션 배경 + 은은한 빛망울 장식 ------------------------- */
.home-hero-wrap{position:relative;overflow:hidden;border-radius:var(--radius);
  padding:64px 44px;display:flex;flex-direction:column;gap:18px;
  background:linear-gradient(135deg,#0B1E4D 0%,#123A8C 32%,#1D5FD6 62%,#38BDF8 100%);
  box-shadow:0 24px 60px -20px rgba(11,30,77,.55)}
.home-hero-wrap::before,.home-hero-wrap::after{content:'';position:absolute;
  border-radius:50%;filter:blur(70px);pointer-events:none}
.home-hero-wrap::before{width:360px;height:360px;background:#7DD3FC;opacity:.35;
  top:-140px;right:-100px}
.home-hero-wrap::after{width:280px;height:280px;background:#60A5FA;opacity:.30;
  bottom:-120px;left:-70px}
.home-hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;max-width:720px}
.home-eyebrow{align-self:flex-start;background:rgba(255,255,255,.14);color:#FFFFFF;
  border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(3px)}
.home-hero-inner .h1{color:#FFFFFF;font:800 34px/1.35 var(--ff);text-wrap:pretty;max-width:none}
.home-hero-inner .sub{color:rgba(255,255,255,.86);font-size:14px;max-width:600px}
.home-hero-inner .hero-meta span{color:#EAF3FF;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 12px}
.home-hero-inner .hero-row{margin-top:6px}
.home-cta-primary{font:800 14px/1.4 var(--ff);color:#123A8C;background:#FFFFFF;
  border:none;border-radius:12px;padding:13px 22px;cursor:pointer;
  box-shadow:0 10px 24px -6px rgba(6,15,40,.5)}
.home-cta-primary:hover{background:#EAF3FF}
.home-cta-ghost{font:700 14px/1.4 var(--ff);color:#FFFFFF;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.55);border-radius:12px;padding:12px 21px;cursor:pointer}
.home-cta-ghost:hover{background:rgba(255,255,255,.2)}

/* ---- 섹션 공통 — 흰색과 옅은 하늘색 배경을 번갈아 써서 리듬을 만듭니다 --- */
.home-sec{padding:34px 30px 36px;display:flex;flex-direction:column;gap:20px;
  border-radius:var(--radius);background:#FFFFFF;border:1px solid var(--border);
  box-shadow:0 1px 2px rgba(16,24,40,.04)}

<script>
/* ###########################################################################

   MyHerb — 영양제 섭취 리포트 (프론트엔드)

   ---------------------------------------------------------------------------
   이 파일이 하는 일과 하지 않는 일
   ---------------------------------------------------------------------------
   판정(어떤 성분이 과다한지, 어떤 약과 부딪히는지)은 백엔드의 AI 가 합니다.
   이 파일은 두 가지만 합니다.

     1) 사용자에게서 입력을 받는다        → Input
     2) 백엔드가 돌려준 판정 결과를 그린다 → Report

   그래서 이 파일에는 원래 '계산 코드'가 없어야 합니다.
   지금은 백엔드가 아직 없어서, 임시로 브라우저에서 계산하는 코드가
   [목업 블록] 안에 들어 있습니다. 백엔드가 준비되면 그 블록을 통째로
   지우면 됩니다. 다른 코드는 한 줄도 건드리지 않습니다.

   ---------------------------------------------------------------------------
   파일 순서 — Ctrl+F 로 대괄호 이름을 검색하면 바로 찾아갑니다
   ---------------------------------------------------------------------------
   [A] 화면 토큰      색·수준 라벨. 화면 생김새를 정합니다.          (계속 사용)
   [B] 유틸           이스케이프·숫자 서식·조사 처리.                (계속 사용)
   [C] 입력 폼 정의   검진 항목·만성질환 목록. 입력칸을 만듭니다.    (계속 사용)
   [D] ★ API 경계 ★  백엔드와 만나는 유일한 지점. 여기만 고칩니다.
   [E] ▼ 목업 블록 ▼  백엔드 대신 브라우저에서 계산하는 임시 코드.
                      백엔드 연결 후 통째로 삭제.
   [F] 렌더           Report 를 받아 화면을 그립니다.                (계속 사용)
   [G] 화면 전환      불러오는 중 / 입력 / 분석 중 / 리포트 / 실패.  (계속 사용)
   [H] 이벤트·시작                                                   (계속 사용)

   ---------------------------------------------------------------------------
   백엔드 연결할 때 할 일 (요약)
   ---------------------------------------------------------------------------
     1. [D] 의 USE_MOCK 을 false 로 바꿉니다.
     2. [D] 의 API_BASE 에 서버 주소를 적습니다.
     3. [E] 목업 블록 전체를 지웁니다. (시작·끝 표시가 있습니다)
     4. 끝. 화면 코드는 손대지 않습니다.

   주고받는 데이터의 정확한 형태는 함께 드린 '백엔드 연동 규격서'에
   예시 JSON 과 함께 정리해 두었습니다.

   ---------------------------------------------------------------------------
   ※ 주의 — 지금 목업에 들어 있는 값 중
     - 검진 판정기준은 국가 건강검진 실시기준 [별표 4] 를 옮긴 것입니다.
     - 성분 기준값과 상호작용 규칙은 예시입니다. 실제 서비스에 그대로
       쓰면 안 됩니다. USE_MOCK 이 true 인 동안에는 화면 맨 위에
       경고 띠가 자동으로 뜹니다.

   ########################################################################### */


/* =========================================================================
   [B] 유틸 — 문자열 이스케이프와 자주 쓰는 작은 부품들
   ========================================================================= */
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmt = n => Number(n).toLocaleString('ko-KR', {maximumFractionDigits:1});

/** 게이지 가운데 숫자의 글자 크기 — 자릿수가 늘면 글자를 줄입니다.
    화면 생김새에 관한 것이므로 서버가 아니라 여기서 정합니다. */
function gaugeSize(label){
  const digits = (String(label).match(/\d/g) || []).length;
  if(!digits) return 24;
  return digits === 1 ? 32 : digits === 2 ? 30 : digits === 3 ? 26 : 24;
}

/** 색이 필요한 부품은 전부 토큰(TONE)에서 색을 받아 갑니다. */
const chip = (text, tone) => {
  const t = TONE[tone];
  return `<span class="chip" style="background:${t.bg};color:${t.fg};border-color:${t.bd}">${esc(text)}</span>`;
};
const tag = (text, tone) => {
  const t = TONE[tone];
  return `<span class="tag" style="background:${t.bg};color:${t.fg};border-color:${t.bd}">${esc(text)}</span>`;
};
const bigchip = (text, tone) => {
  const t = TONE[tone];
  return `<span class="bigchip" style="background:${t.bg};color:${t.fg};border-color:${t.bd}">${esc(text)}</span>`;
};

/** 데이터가 없을 때 그 자리에 대신 들어가는 카드 */
const emptyCard = (title, desc, link, plain, to) =>
  `<div class="empty${plain ? ' plain' : ''}">
     <span class="empty-t">${esc(title)}</span>
     <span class="empty-d">${esc(desc)}</span>
     ${link ? `<a class="link" href="#"${to ? ` data-act="edit" data-to="${to}"` : ''}>${esc(link)}</a>` : ''}
   </div>`;

/** 입력 화면의 해당 섹션으로 이동하는 링크.
    to 는 'profile' | 'exam' | 'meds' | 'products' 입니다. */
const editLink = (to, text) =>
  `<a class="link edit" href="#" data-act="edit" data-to="${to}">${esc(text)}</a>`;

/** 조사 — 앞말의 받침에 따라 은/는, 이/가, 을/를 을 고릅니다. */
const JONG = {'0':1,'1':1,'3':1,'6':1,'7':1,'8':1,'2':0,'4':0,'5':0,'9':0,
              'l':1,'m':1,'n':1,'r':1,'L':1,'M':1,'N':1,'R':1};
function josa(word, withJong, without){
  const c = String(word || '').trim().slice(-1);
  const code = c.charCodeAt(0);
  let has;
  if(code >= 0xAC00 && code <= 0xD7A3) has = (code - 0xAC00) % 28 !== 0;  // 한글
  else if(c in JONG)                   has = !!JONG[c];                   // 숫자·영문 발음
  else                                 has = false;
  return word + (has ? withJong : without);
}
const eun = w => josa(w, '은', '는');
const ga  = w => josa(w, '이', '가');
const eul = w => josa(w, '을', '를');


/* =========================================================================
   [A] 화면 토큰 — 색 TONE
   화면의 모든 색이 여기서 나옵니다. HTML 에 색을 직접 쓰지 않으므로
   여기 한 줄만 바꾸면 배지·막대·게이지·코멘트가 한꺼번에 바뀝니다.
     fg  글자와 선 색   bg  배경색   bd  테두리색   ink  긴 문장의 글자색

   ※ 백엔드는 색 이름(green/orange/red/crit/blue/gray)만 내려보냅니다.
     실제 색값은 이 파일이 정합니다. 서버가 #15803D 같은 색을 직접
     내려보내지 않도록 하세요. 디자인을 바꿀 때 서버까지 고쳐야 합니다.
   ========================================================================= */
const TONE = {
  green : {fg:'#15803D', bg:'#EAF6EE', bd:'#C3E5CE', ink:'#14532D'},
  orange: {fg:'#C2410C', bg:'#FFF1E8', bd:'#FBD3B8', ink:'#9A3412'},
  red   : {fg:'#DC2626', bg:'#FDECEC', bd:'#F7D4D4', ink:'#991B1B'},
  crit  : {fg:'#991B1B', bg:'#FDECEC', bd:'#F7D4D4', ink:'#991B1B'},
  blue  : {fg:'#1E3A8A', bg:'#EAEFF9', bd:'#CBD8F0', ink:'#1E3A8A'},
  gray  : {fg:'#6B7280', bg:'#F3F4F6', bd:'#E5E7EB', ink:'#4B5563'},
};

/* -------------------------------------------------------------------------
   [A] 화면 토큰 — 섭취 수준 LEVEL
   백엔드는 level 로 아래 여섯 개 키 중 하나만 내려보냅니다
   (over · near · low · none · unknown · met).
   그 키를 무슨 색·무슨 글자로 보여 줄지는 이 표가 정합니다.
     rda / ul  탭별로 다르게 부르는 이름
     rank      카드 정렬 순서. 숫자가 클수록 앞에 옵니다.
   ------------------------------------------------------------------------- */
const LEVEL = {
  over   : {tone:'crit'  , rda:'매우 과다', ul:'매우 과다', rank:5},
  near   : {tone:'orange', rda:'상한 근접', ul:'상한 근접', rank:4},
  /* '부족'과 '미섭취'는 파랑입니다. 빨강은 '상한을 넘었다'는 위험 신호에만
     씁니다. 식사 기준으로 보면 대부분의 성분이 부족으로 나오는데, 이걸
     전부 빨강으로 칠하면 화면이 경고로 뒤덮여 진짜 위험이 묻힙니다.
     또 권장량의 92%를 빨강으로 보여 주면 위험한 상태로 오해하게 됩니다.
     되돌리시려면 이 두 줄의 tone 을 'red' 로 바꾸면 됩니다. */
  low    : {tone:'blue'  , rda:'부족'    , ul:'부족'    , rank:3},
  none   : {tone:'blue'  , rda:'미섭취'  , ul:'미섭취'  , rank:2},
  unknown: {tone:'gray'  , rda:'확인 불가', ul:'확인 불가', rank:1},
  met    : {tone:'green' , rda:'충족'    , ul:'적정'    , rank:0},
};

const LAYOUT = {maxCols:4, gaugeArc:163.4};   // 반원 길이 = π×52

/* =========================================================================
   [C] 입력 폼 정의
   -------------------------------------------------------------------------
   사용자에게 무엇을 물어볼지 정합니다. '판정'과는 상관이 없습니다.
   (판정은 백엔드가 합니다. 아래 EXAM 안에 판정 함수가 아직 붙어 있는데,
    그건 백엔드가 없는 동안 목업이 쓰는 것입니다. 자세한 설명은 EXAM 위에.)
   ========================================================================= */

/* 영양제 함량 입력칸의 단위 선택지 */
const UNITS = ['mg','µg','g','IU','mL','억CFU'];

/* -------------------------------------------------------------------------
   검진 항목 EXAM — 입력 화면을 만드는 설계도
   -------------------------------------------------------------------------
   여기 배열의 순서가 그대로 입력 화면의 접이식 그룹 순서이고,
   리포트 표의 구분줄 순서입니다. 항목을 지우면 입력칸도 같이 사라집니다.

   ★ 이 배열은 지금 두 가지 일을 겸하고 있습니다.
       group · name · inputs  →  입력칸을 만드는 데 씁니다.   (계속 필요)
       ref · show · judge     →  판정에 씁니다.               (목업 전용)

     백엔드가 판정을 맡게 되면 ref · show · judge 는 아무도 부르지 않는
     죽은 코드가 됩니다. 그때 지우셔도 되고 그냥 두셔도 동작에는 지장이
     없습니다. (지우실 거라면 [E] 목업 블록을 지우는 김에 함께 지우세요.)

     입력칸 정의까지 서버에서 내려받고 싶다면 /api/bootstrap 응답에
     examSchema 를 담아 이 배열 대신 쓰면 됩니다. 다만 검진 항목은
     자주 바뀌지 않으므로 지금처럼 파일에 두는 편이 단순합니다.

   항목 한 개 추가하는 방법 —
     {key:'ua', name:'요산',
      inputs:[{key:'ua', unit:'mg/dL'}],          // 입력칸. key 가 저장 이름
      ref:() => '7.0 이하',                        // 표의 '판정 기준' 칸 문구
      show:v => num(v.ua) == null ? '—' : `${v.ua} mg/dL`,   // '내 수치' 칸
      judge:v => {                                 // 판정
        const x = num(v.ua);
        return x == null ? JUDGE.N : x > 7.0 ? JUDGE.D : JUDGE.A;
      }},

   칸 설명 —
     inputs  입력칸 목록. 여러 개를 묶어 하나로 판정할 수 있습니다
             (혈압 = 수축기+이완기, BMI = 키+몸무게, 폐기능 = 세 값).
             type:'select' 와 options 를 주면 숫자 대신 선택 상자가 됩니다.
     ref     성별에 따라 기준이 다르면 ctx 를 씁니다.
             예: ctx => isMale(ctx) ? '90 미만' : '85 미만'
     judge   반환값은 JUDGE.A(정상A) / JUDGE.B(경계) / JUDGE.D(질환의심) /
             JUDGE.N(미입력) 중 하나입니다.
             문구를 바꾸고 싶으면 J('D', '중간정도 우울증 의심') 처럼 씁니다.
             advice 를 붙이면 리포트 요약에 안내 문구가 강조되어 나옵니다.

   ※ 지금 값은 국가 건강검진 실시기준 [별표 4] 를 옮긴 것입니다.
     고시가 개정되면 이 배열만 고치면 됩니다.
   ------------------------------------------------------------------------- */
const EXAM = [
  {group:'폐결핵·기타흉부질환', items:[
    {key:'cxr', name:'흉부방사선촬영',
     inputs:[{key:'cxr', type:'select', options:['', '정상', '비활동성 폐결핵', '그 외 소견']}],
     ref:() => '정상',
     show:v => v.cxr || '—',
     judge:v => !v.cxr ? JUDGE.N
              : v.cxr === '정상' ? JUDGE.A
              : v.cxr === '비활동성 폐결핵' ? JUDGE.B : JUDGE.D},
  ]},

  {group:'고혈압', items:[
    {key:'bp', name:'혈압',
     inputs:[{key:'sbp', name:'수축기', unit:'mmHg'}, {key:'dbp', name:'이완기', unit:'mmHg'}],
     ref:() => '120/80 미만',
     show:v => (num(v.sbp) == null && num(v.dbp) == null) ? '—' : `${v.sbp || '—'}/${v.dbp || '—'}`,
     judge:v => {
       const s = num(v.sbp), d = num(v.dbp);
       if(s == null || d == null) return JUDGE.N;
       if(s >= 140 || d >= 90) return JUDGE.D;          // 140 이상 또는 90 이상
       if(s < 120 && d < 80)   return JUDGE.A;          // 120 미만 이며 80 미만
       return JUDGE.B;                                   // 120-139 또는 80-89
     }},
  ]},

  {group:'비만', items:[
    {key:'bmi', name:'체질량지수(BMI)',
     inputs:[{key:'height', name:'키', unit:'cm'}, {key:'weight', name:'몸무게', unit:'kg'}],
     ref:() => '18.5~24.9',
     show:v => {
       const b = bmiOf(v);
       return b == null ? '—' : `${b.toFixed(1)} kg/m²`;
     },
     judge:v => {
       const b = bmiOf(v);
       if(b == null) return JUDGE.N;
       if(b < 18.5 || b >= 30) return JUDGE.D;
       if(b <= 24.9) return JUDGE.A;
       return JUDGE.B;                                   // 25 ~ 29.9
     }},
    {key:'waist', name:'허리둘레',
     inputs:[{key:'waist', unit:'cm'}],
     ref:ctx => isMale(ctx) ? '90 미만' : '85 미만',
     show:v => num(v.waist) == null ? '—' : `${v.waist} cm`,
     judge:(v, ctx) => {
       const w = num(v.waist);
       if(w == null) return JUDGE.N;
       return w < (isMale(ctx) ? 90 : 85) ? JUDGE.A : JUDGE.B;   // 질환의심 구분 없음
     }},
  ]},

  {group:'빈혈', items:[
    {key:'hb', name:'혈색소',
     inputs:[{key:'hb', unit:'g/dL'}],
     ref:ctx => isMale(ctx) ? '13.0~16.5' : '12.0~15.5',
     show:v => num(v.hb) == null ? '—' : `${v.hb} g/dL`,
     judge:(v, ctx) => {
       const h = num(v.hb);
       if(h == null) return JUDGE.N;
       if(isMale(ctx)){
         if(h < 12.0) return JUDGE.D;
         if(h < 13.0) return JUDGE.B;

const CHRONIC = ['고혈압','당뇨병','이상지질혈증','폐결핵','우울증','조기정신증','C형간염','만성폐쇄성폐질환'];


/* =========================================================================
   [D] ★ API 경계 ★  — 백엔드와 만나는 유일한 지점
   -------------------------------------------------------------------------
   이 파일에서 서버와 이야기하는 곳은 여기 하나뿐입니다.
   화면을 그리는 코드는 아래 API.* 만 부르고, 서버 주소도 응답 형태도
   모릅니다. 그래서 서버가 바뀌어도 화면 코드는 그대로입니다.

   ── 백엔드 연결하는 법 (세 단계) ───────────────────────────────────────
     1. 바로 아래 USE_MOCK 을 false 로 바꿉니다.
     2. API_BASE 에 서버 주소를 적습니다. (같은 도메인이면 '' 그대로 두세요)
     3. [E] 목업 블록을 통째로 지웁니다.
     끝입니다. 이 아래 화면 코드는 한 줄도 건드리지 않습니다.

   ── 서버가 제공해야 하는 것 네 가지 ────────────────────────────────────
     GET  /api/bootstrap   화면 열 때 한 번. 성분 이름 추천 목록 등.
     GET  /api/draft       로그인한 사용자가 저장해 둔 입력값 불러오기
     PUT  /api/draft       입력값 저장 (사용자가 입력하는 동안 자동으로)
     POST /api/analyze     ★ 핵심. 입력을 보내고 AI 판정 결과를 받습니다.

   주고받는 JSON 의 정확한 형태는 함께 드린 '백엔드 연동 규격서'에
   예시와 함께 정리되어 있습니다.
   ========================================================================= */

const USE_MOCK = true;      /* ← 백엔드가 준비되면 false 로 */
const API_BASE = '';        /* ← 예: 'https://api.myherb.co.kr' */

/** 서버 오류를 화면이 알아들을 수 있는 형태로 감쌉니다.
    code 로 무엇이 잘못됐는지 구분하고, message 는 사용자에게 보여 줍니다. */
class ApiError extends Error {
  constructor(code, message, detail){
    super(message);
    this.code = code;             // LOGIN_REQUIRED · TIMEOUT · NETWORK · HTTP_500 ...
    this.detail = detail || '';   // 개발자용 원문 (화면 하단에 작게 표시)
  }
}

/** 모든 서버 호출이 지나가는 통로. 인증 쿠키·시간초과·오류 변환을 한곳에서.
    surfaceMessage: true 면 서버가 보낸 message 를 화면에 그대로 보여 줍니다.
    로그인·회원가입 폼처럼 '왜 실패했는지'가 사용자에게 중요한 경우에만 켜세요.
    그 밖의 요청은 서버 메시지를 detail(개발자용)에만 남기고, 화면에는
    두루뭉술한 문구를 보여 주는 게 안전합니다(문구가 사용자 안내로
    다듬어져 있다는 보장이 없으므로). */
async function call(path, {method = 'GET', body, timeout = 60000, surfaceMessage = false} = {}){
  const ctrl  = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(API_BASE + path, {
      method,
      headers    : {'Content-Type': 'application/json'},
      credentials: 'include',        /* 로그인 쿠키를 함께 보냅니다 */
      body       : body ? JSON.stringify(body) : undefined,
      signal     : ctrl.signal,
    });

    /* ★ 401/403 은 이 서비스 전체에서 '로그인 세션이 없거나 끊겼다'는
       뜻으로만 씁니다. 로그인·회원가입 요청 자체가 거절된 경우(비밀번호
       틀림, 이메일 중복 등)는 서버가 401/403 이 아닌 다른 코드(예: 400)로
       내려줘야 여기서 재로그인 모달로 잘못 넘어가지 않습니다. */
    if(res.status === 401 || res.status === 403)
      throw new ApiError('LOGIN_REQUIRED', '로그인이 필요합니다.');

    if(!res.ok){
      let detail = '';
      try { const j = await res.json(); detail = j.message || JSON.stringify(j); }
      catch(_){ detail = await res.text().catch(() => ''); }
      const fallback = res.status >= 500 ? '서버에 문제가 생겼습니다.' : '요청을 처리하지 못했습니다.';
      throw new ApiError('HTTP_' + res.status, (surfaceMessage && detail) ? detail : fallback, detail);
    }
    return await res.json();

  } catch(e){
    if(e instanceof ApiError) throw e;
    if(e.name === 'AbortError')
      throw new ApiError('TIMEOUT', '응답이 너무 오래 걸립니다. 잠시 후 다시 시도해 주세요.');
    throw new ApiError('NETWORK', '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.', String(e && e.message || e));
  } finally {
    clearTimeout(timer);
  }
}

const API = {
  /** 지금 목업으로 도는 중인지. 화면 맨 위 경고 띠가 이 값을 봅니다. */
  get source(){ return USE_MOCK ? 'mock' : 'server'; },

  /** 화면을 열 때 한 번 — 성분 이름 추천 목록 등 */
  bootstrap(){
    if(USE_MOCK) return MOCK.bootstrap();
    return call('/api/bootstrap', {timeout:15000});
  },

  /** 저장해 둔 입력값 불러오기. 없으면 null.
      로그인이 안 되어 있어도 화면은 그냥 열려야 하므로 null 로 넘깁니다. */
  async loadDraft(){
    if(USE_MOCK) return MOCK.loadDraft();
    try { return await call('/api/draft', {timeout:15000}); }
    catch(e){
      if(e.code === 'LOGIN_REQUIRED' || e.code === 'HTTP_404') return null;

/* =========================================================================

        판정 코드  A = 정상A   B = 정상B(경계)   D = 질환의심   '' = 미입력
        각 항목은 입력칸(inputs) 여러 개를 묶어 하나의 판정을 냅니다.
   ========================================================================= */
const JUDGE = {
  A: {code:'A', text:'정상A',   tone:'green'},
  B: {code:'B', text:'경계',    tone:'orange'},
  D: {code:'D', text:'질환의심', tone:'red'},
  N: {code:'',  text:'미입력',   tone:'gray'},
};
/** 코드에 다른 문구를 붙이고 싶을 때 (예: 청력 '정상', 우울증 '가벼운 우울증상') */
const J = (code, text) => ({...JUDGE[code], text: text || JUDGE[code].text});

const num = v => (v === '' || v == null || Number.isNaN(Number(v))) ? null : Number(v);
const isMale = ctx => ctx.sex === '남성';

/** 키·몸무게로 BMI 를 계산합니다. 여러 곳에서 씁니다. */
function bmiOf(v){
  const h = num(v.height), w = num(v.weight);
  if(!h || !w) return null;
  return w / ((h / 100) ** 2);
}

/* 어떤 항목이 고혈압·당뇨병·이상지질혈증에 속하는지 (종합 판정 구분에 필요) */
const HTN_DM_LIPID = ['bp','glu','tc','hdl','tg','ldl'];


/* =========================================================================
   5. 계산 — 입력값(state)을 화면이 그대로 그릴 수 있는 모델로 바꿉니다.
      여기서 화면 요소는 만들지 않습니다. 숫자와 판정만 다룹니다.
   ========================================================================= */

/** 입력 단위를 기준표 단위로 환산합니다. 환산할 수 없으면 null 을 돌려줍니다. */
function convert(amount, unit, std){
  const v = Number(amount);
  if(!isFinite(v)) return null;
  if(unit === 'IU')  return (std && std.iu) ? v * std.iu : null;   // 계수 없는 IU 는 환산 불가
  if(!(unit in MASS)) return null;                                 // mL·억CFU 등은 질량이 아님
  const mg = v * MASS[unit];
  return std ? mg / MASS[std.unit] : mg;                           // 기준 없으면 mg 로 모읍니다
}

/* [교체지점 4-3] 섭취 수준을 가르는 구간.
   '상한의 70% 부터 상한 근접' 같은 기준을 바꾸려면 여기 숫자를 고치세요. */
function levelOf(supp, total, std){
  if(!std || (std.rda == null && std.ul == null)) return 'unknown';
  if(!(total > 0)) return 'none';
  const ulAmount = std.ulBasis === 'supp' ? supp : total;          // 상한 비교 대상
  if(std.ul != null && ulAmount > std.ul)       return 'over';
  if(std.ul != null && ulAmount >= std.ul * 0.7) return 'near';
  if(std.rda != null && total >= std.rda)        return 'met';
  return 'low';
}

/* -------------------------------------------------------------------------
   건강검진 — 별표 4 판정기준에 따라 항목마다 정상A / 경계 / 질환의심을 냅니다.
   ------------------------------------------------------------------------- */
function computeExam(state){
  const ctx = {sex: state.sex, age: Number(state.age)};
  const groups = EXAM.map(g => ({
    group: g.group,
    rows: g.items.map(it => ({
      key  : it.key,
      name : it.name,
      ref  : it.ref(ctx),
      value: it.show(state.exam, ctx),
      judge: it.judge(state.exam, ctx),
    })),
  }));
  const rows   = groups.flatMap(g => g.rows);
  const counts = {A:0, B:0, D:0};
  rows.forEach(r => { if(r.judge.code) counts[r.judge.code]++; });

  /* 별표 4 첫 표의 종합 판정 구분 */
  const dRows  = rows.filter(r => r.judge.code === 'D');
  const isMeta = dRows.some(r => HTN_DM_LIPID.includes(r.key));
  let overall;
  if(state.chronic.length)
    overall = {label:'유질환자', tone:'red',
      desc:`${state.chronic.join(' · ')} 진단 후 약물 치료 중으로 입력되었습니다.`};
  else if(isMeta)
    overall = {label:'고혈압·당뇨병·이상지질혈증 질환의심', tone:'red',
      desc:'해당 항목이 기준을 벗어나 진료와 검사가 필요합니다.'};
  else if(dRows.length)
    overall = {label:'일반 질환의심', tone:'red',
      desc:'추적검사나 전문 의료기관의 정확한 진단이 필요합니다.'};
  else if(counts.B)
    overall = {label:'정상B(경계)', tone:'orange',
      desc:'건강에 이상은 없으나 식생활습관 개선 등 자가관리가 필요합니다.'};
  else if(counts.A)
    overall = {label:'정상A', tone:'green', desc:'검진 결과 건강이 양호합니다.'};
  else
    overall = {label:'미입력', tone:'gray', desc:'검진 결과를 입력하면 종합 판정을 계산합니다.'};

  return {groups, rows, counts, overall,
          filled: counts.A + counts.B + counts.D,
          abnormal: rows.filter(r => r.judge.code === 'D' || r.judge.code === 'B')};
}

/* -------------------------------------------------------------------------
   자유 입력된 성분들을 하나로 모읍니다.
   같은 성분인지는 기준표의 별칭으로 판단하고, 기준표에 없으면
   사용자가 적은 표기를 그대로 key 로 씁니다(그 성분은 '확인 불가'가 됩니다).
   ------------------------------------------------------------------------- */
function computeNutrients(state){
  const bucket = {};   // key → 합산 상태

  /* [식사 기준 모드] 식사 평균 추정치로 계산하겠다고 켜 두었으면,
     사용자가 영양제를 넣지 않은 성분까지 기준표에서 미리 깔아 둡니다.
     이렇게 해야 '나는 이 성분을 아예 안 챙기고 있다'가 카드로 보이고,
     추천 목록에도 올라갈 수 있습니다.
     끄면 예전처럼 사용자가 적어 넣은 성분만 계산합니다. */
  if(state.countMeal){
    STD_LIST.forEach(std => {
      if(!std.meal || std.rda == null) return;      // 식사 추정치나 권장량이 없으면 비교할 수 없습니다
      bucket[std.name] = {
        std, key:std.name, label:std.name, unit:std.unit,
        supp:0, sources:[], unmapped:[],
      };
    });
  }

  state.products.forEach(p => {
    const pname = p.name || '이름 없는 제품';
    p.items.forEach(it => {
      if(!it.name) return;
      const std = findStd(it.name);
      const key = std ? std.name : normKey(it.name);
      const b = bucket[key] || (bucket[key] = {
        std, key,
        label   : std ? std.name : it.name.trim(),
        unit    : std ? std.unit : (it.unit in MASS ? 'mg' : it.unit),
        supp    : 0,
        sources : [],
        unmapped: [],          // 환산하지 못한 입력 (IU·mL·억CFU 등)
      });
      const v = convert(it.amount, it.unit, std);
      if(v == null) b.unmapped.push(`${pname}: ${it.amount || '?'}${it.unit}`);
      else          b.supp += v;
      if(!b.sources.includes(pname)) b.sources.push(pname);
    });
  });

  return Object.values(bucket).map(b => {
    const std   = b.std;
    const meal  = (state.countMeal && std && std.meal) ? std.meal : 0;
    const total = b.supp + meal;
    const level = levelOf(b.supp, total, std);
    const rda   = std ? std.rda : null;
    const ul    = std ? std.ul  : null;
    const scale = ul != null ? ul : (rda != null ? rda * 2 : (total || 1));

    return {
      key:b.key, name:b.label, unit:b.unit, rda, ul, std,
      supp:b.supp, meal, total, level,
      /* 상한을 실제로 무엇과 비교했는지. 마그네슘·엽산처럼 영양제분만
         비교하는 성분은 total 이 아니라 supp 가 기준입니다. */
      ulAmount: (std && std.ulBasis === 'supp') ? b.supp : total,
      ulSuppOnly: !!(std && std.ulBasis === 'supp'),
      sources:b.sources, unmapped:b.unmapped,
      basis: !std ? '표준 기준 미등록'
           : (rda != null && ul != null) ? `권장 ${fmt(rda)} · 상한 ${fmt(ul)}${std.unit}${std.ulBasis === 'supp' ? ' (영양제 기준)' : ''}`
           : (ul  != null)               ? `상한 ${fmt(ul)}${std.unit}`
           : (rda != null)               ? `권장 ${fmt(rda)}${std.unit} 이상`
           : '기준 없음',
      bar: {
        supp   : Math.min(b.supp / scale, 1) * 100,
        meal   : Math.max(0, Math.min(meal / scale, 1 - b.supp / scale)) * 100,
        rdaMark: (rda != null && rda <= scale) ? rda / scale * 100 : null,
      },
      pct: {
        rda: rda ? total / rda : (ul ? total / ul : null),
        ul : ul  ? (std && std.ulBasis === 'supp' ? b.supp : total) / ul : (rda ? total / rda : null),
      },
    };
  }).sort((a, b) =>
    /* 1순위 — 위험한 것부터 (상한 초과 → 근접 → 부족 → 적정) */
    (LEVEL[b.level].rank - LEVEL[a.level].rank) ||
    /* 2순위 — 같은 수준이면 사용자가 실제로 먹고 있는 성분을 앞에 */
    (b.sources.length - a.sources.length) ||
    /* 3순위 — 그래도 같으면 이름순으로 (순서가 매번 바뀌지 않게) */
    a.name.localeCompare(b.name, 'ko'));
}

/** 상호작용 · 중복 · 환산 실패를 점검 행으로 만듭니다. */
function computeIssues(state, nutrients){
  const out = [];

  nutrients.forEach(n => {
    if(n.level === 'over') out.push({kind:'상한 초과', tone:'red',
      text:`${n.name} ${n.ulSuppOnly ? '영양제 섭취량' : '합산량'} ${fmt(n.ulAmount)}${n.unit}이 상한 ${fmt(n.ul)}${n.unit}을 넘습니다. 제품 구성을 조정해 보세요.`});
    else if(n.level === 'near') out.push({kind:'상한 근접', tone:'orange',
      text:`${ga(n.name)} 상한의 70%를 넘었습니다. 같은 성분이 든 제품을 더하면 초과할 수 있습니다.`});
  });

  nutrients.forEach(n => {
    if(n.sources.length > 1) out.push({kind:'성분 중복', tone:'blue',
      text:`${ga(n.name)} ${n.sources.join(' · ')} 에 함께 들어 있습니다.`});
  });

  state.meds.forEach(m => MED_RULES.forEach(r => {
    const hit = r.med.some(k => normKey(m.name).includes(normKey(k)));
    if(hit && nutrients.some(n => n.name === r.nut))
      out.push({kind:r.kind, tone:r.tone, med:m.name, text:`${m.name} · ${r.text}`});
  }));

  nutrients.forEach(n => {
    if(n.unmapped.length) out.push({kind:'환산 불가', tone:'gray',
      text:`${n.name}의 ${n.unmapped.join(', ')} — 단위를 환산할 수 없어 합산에서 제외했습니다.`});
  });

  const unknown = nutrients.filter(n => !n.std).map(n => n.name);
  if(unknown.length) out.push({kind:'기준 미등록', tone:'gray',
    text:`${eun(unknown.join(', '))} 기준값이 등록되어 있지 않아 비율을 계산하지 못했습니다.`});

  return out;
}

/* -------------------------------------------------------------------------
   추천 영양제 — 무엇을 더 챙기면 좋을지 고릅니다.
   -------------------------------------------------------------------------
   ★ 여기 규칙은 '숫자로 설명되는 것'만 다룹니다.
       · 지금 섭취량(식사 + 영양제)이 권장량에 못 미치는 성분을 고릅니다.
       · 이미 충분하거나 상한에 가까운 성분은 뺍니다.
       · 복용 중인 약과 부딪히는 성분은 빼지 않고 '주의' 표시만 붙입니다.
         (임의로 빼 버리면 사용자가 이유를 알 수 없습니다.)

   ★ 일부러 하지 않은 것 —
     '혈압이 경계니까 이 성분을 드세요' 같은 검진 결과와 성분의 연결은
     임상 근거가 필요한 판단이라 목업에서 지어내지 않았습니다.
     검진 입력은 '함께 고려했다'는 표시와, 이상 소견이 있을 때
     전문가 상담 권고 문구로만 반영합니다.
     실제 서비스에서는 이 판단을 AI 백엔드가 하게 되며, 그 규칙은
     반드시 전문가 검토를 거쳐야 합니다. (규격서 7장 참고)
   ------------------------------------------------------------------------- */
function computeRecommend(state, nutrients, exam){
  const hasProducts = state.products.length > 0;

  /* 약 이름 안에 상호작용 규칙이 걸리는 성분을 미리 모아 둡니다 */
  const cautionOf = {};
  state.meds.forEach(m => MED_RULES.forEach(r => {
    if(r.med.some(k => normKey(m.name).includes(normKey(k))))
      (cautionOf[r.nut] = cautionOf[r.nut] || []).push(`${m.name} · ${r.kind}`);
  }));

  const shortfall = nutrients
    .filter(n => n.std && n.rda != null)
    .filter(n => n.level === 'low' || n.level === 'none');

  const items = shortfall
    .map(n => {
      const gap   = Math.max(0, n.rda - n.total);
      const ratio = n.rda ? n.total / n.rda : 0;
      const caution = cautionOf[n.name];
      return {
        name  : n.name,
        amount: `${fmt(gap)}${n.unit} 더`,
        reason: n.supp > 0
          ? `지금 ${fmt(n.total)}${n.unit}로 권장량의 ${Math.round(ratio * 100)}%입니다. 영양제를 함께 넣어도 모자랍니다.`
          : `식사 추정치로 ${fmt(n.total)}${n.unit}, 권장량 ${fmt(n.rda)}${n.unit}의 ${Math.round(ratio * 100)}%입니다.`,
        /* 많이 모자라면 주황, 조금 모자라면 파랑. 빨강은 쓰지 않습니다 —
           '부족'은 위험이 아니라 채울 여지이기 때문입니다. */
        tone   : ratio < 0.5 ? 'orange' : 'blue',
        caution: caution ? `복용 중인 ${caution[0]} — 시작 전 의사·약사와 상의하세요.` : '',
        _ratio : ratio,
      };
    })
    .sort((a, b) => a._ratio - b._ratio)     // 가장 많이 모자란 것부터
    .slice(0, 6);

  items.forEach(i => delete i._ratio);

  /* 무엇을 근거로 골랐는지 사용자에게 그대로 밝힙니다 */
  const basis = [];
  basis.push(state.countMeal ? '식사 평균 추정치' : '입력하신 영양제');
  if(hasProducts && state.countMeal) basis.push('복용 중인 영양제');
  if(state.meds.length)  basis.push(`복용 중인 약 ${state.meds.length}건`);
  if(exam.filled)        basis.push(`검진 ${exam.filled}개 항목`);

  const enough  = nutrients.filter(n => n.level === 'met').length;
  const basisKo = eul(basis.join(' · '));      /* 앞말 받침에 따라 을/를 을 고릅니다 */
  let desc;
  if(!items.length){
    desc = `${basisKo} 기준으로 보면 권장량에 못 미치는 성분이 없습니다.` +
           (enough ? ` ${enough}개 성분이 권장 범위 안에 있습니다.` : '');
  } else {
    desc = `${basisKo} 기준으로, 권장량에 못 미치는 성분을 모자란 순서로 골랐습니다.` +
           (hasProducts ? ' 이미 드시는 영양제로 채워지는 성분은 뺐습니다.' : '');
  }

  /* 검진에 이상 소견이 있으면 추천보다 상담이 먼저입니다 */
  const advice = exam.abnormal && exam.abnormal.length
    ? `건강검진에서 ${exam.abnormal.length}개 항목이 기준을 벗어났습니다. 영양제를 고르기 전에 의사·약사와 상의하시기를 권합니다.`
    : '';

  /* 상위 6개만 보여주므로, 나머지가 있으면 그 사실을 밝힙니다.
     밝히지 않으면 '부족한 건 이 6개뿐'으로 읽힙니다. */
  const more = Math.max(0, shortfall.length - items.length);

  return {
    title: items.length ? '이런 성분을 더 챙겨 보세요' : '지금은 더 챙길 성분이 없습니다',
    desc, items, advice, more,
    moreText: more
      ? `이 밖에 ${more}개 성분도 권장량에 못 미칩니다. 아래 섭취량 카드에서 모두 확인하실 수 있습니다.`
      : '',
    note: '권장섭취량에 견준 계산 결과일 뿐, 특정 제품이나 복용을 권하는 것이 아닙니다. ' +
          '복용을 시작하기 전에 의사·약사와 상의하세요.',
  };
}

function buildModel(state){
  const exam      = computeExam(state);
  const nutrients = computeNutrients(state);
  const issues    = computeIssues(state, nutrients);
  const recommend = computeRecommend(state, nutrients, exam);
  const worst     = nutrients.reduce((m, n) => LEVEL[n.level].rank > LEVEL[m].rank ? n.level : m, 'met');
  return {
    state, exam, nutrients, issues, recommend, worst,
    hasSupp   : nutrients.length > 0,
    mealOnly  : state.products.length === 0,   /* 영양제 없이 식사 기준만으로 본 결과인지 */
    cols      : Math.min(Math.max(nutrients.length, 1), LAYOUT.maxCols),
  };
}


/* -------------------------------------------------------------------------
   목업 구현 — [D] 의 API 가 부르는 네 가지
   ------------------------------------------------------------------------- */
const MOCK = {

  /* 성분 이름 추천 목록. 실제로는 서버가 성분 사전을 내려줍니다. */
  async bootstrap(){
    await nap(150);
    return {nutHints: STD_LIST.map(s => s.name)};
  },

  /* 저장소 흉내. 실제로는 로그인한 사용자별로 서버 DB 에 들어갑니다.
     새로고침하면 사라지는 게 정상입니다(목업이라서 — 아래 세션도 같은
     이유로 새로고침하면 로그아웃됩니다). */
  _draft: null,
  async loadDraft(){
    await nap(120);
    if(!MOCK._session) throw new ApiError('LOGIN_REQUIRED', '로그인이 필요합니다.');
    return MOCK._draft;
  },
  async saveDraft(input){
    await nap(220);
    if(!MOCK._session) throw new ApiError('LOGIN_REQUIRED', '로그인이 필요합니다.');
    MOCK._draft = JSON.parse(JSON.stringify(input));
    return {savedAt: new Date().toISOString()};
  },

  /* ★ 판정. 실제로는 서버의 AI 가 합니다.
     일부러 1~2초 기다립니다 — '분석 중' 화면이 제대로 보이는지
     확인하기 위해서입니다. 실제 AI 응답도 이 정도는 걸립니다. */
  async analyze(input){
    await nap(1300 + Math.random() * 900);
    /* 로그인해야만 쓸 수 있는 서비스이므로, 분석 도중 로그인이 풀렸다면
       (세션 만료 등) 여기서도 다른 API 처럼 LOGIN_REQUIRED 를 돌려줘야
       합니다. 화면은 이 경우 입력을 지우지 않고 재로그인 모달만 다시
       띄운 뒤, 로그인에 성공하면 이 요청을 그대로 다시 보냅니다. */
    if(!MOCK._session) throw new ApiError('LOGIN_REQUIRED', '로그인이 필요합니다.');
    const report = toReport(input);
    /* 실제 서비스에서는 서버가 판정 결과를 자동으로 이력에 남깁니다.
       목업에서도 같은 동작을 흉내 냅니다 — 그래야 '지난 리포트'에 쌓입니다. */
    const id = 'r' + Date.now() + Math.random().toString(36).slice(2, 7);
    MOCK._reports.unshift({id, createdAt:new Date().toISOString(), report});
    return report;
  },

  /* -------------------------------------------------------------------------
     인증 — 이메일·비밀번호로 가입/로그인하는 가장 단순한 형태만 흉내 냅니다.
     소셜 로그인이 필요하면 모달에 버튼만 추가하고, 이 자리에 같은 모양
     ({name, email} 반환)의 메서드를 더 추가하면 됩니다.
     ------------------------------------------------------------------------- */
  _session: null,           // {name, email} | null
  _users: new Map(),        // email(정규화) → {name, email, password}
  _norm(email){ return String(email || '').trim().toLowerCase(); },

  async me(){
    await nap(150);
    if(!MOCK._session) throw new ApiError('LOGIN_REQUIRED', '로그인이 필요합니다.');
    return MOCK._session;
  },

  async login(email, password){
    await nap(500);
    const rec = MOCK._users.get(MOCK._norm(email));
    if(!rec || rec.password !== password)
      throw new ApiError('INVALID_CREDENTIALS', '이메일 또는 비밀번호가 올바르지 않습니다.');
    MOCK._session = {name:rec.name, email:rec.email};
    return MOCK._session;
  },

  async signup(name, email, password){
    await nap(500);
    const key = MOCK._norm(email);
    if(!name || !name.trim())        throw new ApiError('INVALID_INPUT', '이름을 입력해 주세요.');
    if(!key || !key.includes('@'))   throw new ApiError('INVALID_INPUT', '올바른 이메일을 입력해 주세요.');
    if(!password || password.length < 4)
      throw new ApiError('INVALID_INPUT', '비밀번호는 4자 이상으로 입력해 주세요.');
    if(MOCK._users.has(key))         throw new ApiError('EMAIL_TAKEN', '이미 가입된 이메일입니다.');
    MOCK._users.set(key, {name:name.trim(), email:key, password});
    MOCK._session = {name:name.trim(), email:key};
    return MOCK._session;
  },

  async logout(){
    await nap(150);
    MOCK._session = null;
    MOCK._draft   = null;   // 실제 서비스에서는 서버에 남아 있고, 목업은 세션과 함께 지웁니다
    return {};
  },

  /* -------------------------------------------------------------------------
     지난 리포트 — analyze() 가 성공할 때마다 여기 쌓입니다.
     ------------------------------------------------------------------------- */
  _reports: [],   // [{id, createdAt, report}], 최신순

  async listReports(){
    await nap(300);
    if(!MOCK._session) throw new ApiError('LOGIN_REQUIRED', '로그인이 필요합니다.');
    return {reports: MOCK._reports.map(r => ({
      id: r.id,
      createdAt: r.createdAt,
      summaryLine: `${(r.report.badges && r.report.badges[0] && r.report.badges[0].text) || '리포트'} · 성분 ${r.report.nutrients.length}개`,
      worst: r.report.worst,
      badges: r.report.badges,
    }))};
  },

  async getReport(id){
    await nap(250);
    if(!MOCK._session) throw new ApiError('LOGIN_REQUIRED', '로그인이 필요합니다.');
    const rec = MOCK._reports.find(r => r.id === id);
    if(!rec) throw new ApiError('HTTP_404', '리포트를 찾을 수 없습니다.');
    return rec.report;
  },
};

/* -------------------------------------------------------------------------
   계산 결과를 화면이 쓰는 형태(Report)로 포장합니다.
   ★ 이 함수가 만들어 내는 모양이 곧 백엔드가 지켜야 할 응답 형식입니다.
     규격서의 'Report' 항목과 같습니다.
   ------------------------------------------------------------------------- */
function toReport(input){
  const m = buildModel(input);

  /* 성분 카드 아래 코멘트. 실제 서비스에서는 AI 가 쓴 문장이 옵니다. */
  const noteOf = n => ({
    over : {title:'상한 초과.',
            body:`${n.ulSuppOnly ? '영양제로만 ' : ''}${fmt(n.ulAmount)}${n.unit}, 상한 ${fmt(n.ul)}${n.unit}을 넘었습니다. 제품 수를 줄이거나 함량이 낮은 제품으로 바꿔 보세요.`},
    near : {title:'상한 근접.', body:'여기에 같은 성분이 든 제품을 더하면 초과할 수 있습니다.'},
    met  : {title:'충분합니다.', body:'현재 구성을 유지해도 괜찮습니다.'},
    low  : n.sources.length
             ? {title:'권장량에 못 미칩니다.', body:'식사에서 보충하거나 제품의 함량을 확인해 보세요.'}
             : {title:'식사만으로는 모자랍니다.', body:`권장량 ${fmt(n.rda)}${n.unit}까지 ${fmt(Math.max(0, n.rda - n.total))}${n.unit}이 부족합니다. 위의 추천을 참고해 보세요.`},
    none : {title:'섭취량이 없습니다.', body:'등록한 제품에 이 성분이 들어 있지 않습니다.'},
    unknown: {title:'기준값이 없습니다.',
              body: n.unmapped.length
                ? `${n.unmapped.join(', ')} — 이 단위는 환산 규칙이 없어 합산하지 않았습니다.`
                : '기준표에 없는 성분이라 합산량만 표시합니다.'},
  }[n.level]);

  /* 카드 위 작은 캡션 — 어느 제품에서 얼마씩 왔는지 */
  const captionOf = n => {
    /* 제품에서 온 성분이면 제품 이름부터, 식사 추정치만이면 그 사실을 밝힙니다 */
    if(!n.sources.length) return `식사 평균 추정 ${fmt(n.meal)}${n.unit} · 등록한 제품 없음`;
    return n.sources.join(' · ') +
      (n.supp > 0 ? ` · 영양제 ${fmt(n.supp)}${n.unit}` : '') +
      (n.meal    ? ` + 식사 ${fmt(n.meal)}${n.unit}`   : '');
  };

  const nutrients = m.nutrients.map(n => ({
    key:n.key, name:n.name, unit:n.unit, level:n.level,
    supp:n.supp, meal:n.meal, total:n.total,
    rda:n.rda, ul:n.ul,
    hasStd    : !!n.std,          /* 기준값이 등록된 성분인지 (std 객체를 넘기지 않습니다) */
    ulSuppOnly: n.ulSuppOnly,
    ulAmount  : n.ulAmount,
    sources   : n.sources,
    unmapped  : n.unmapped,
    basis     : n.basis,
    bar       : n.bar,
    gauge     : n.pct,            /* {rda, ul} — 각 탭의 게이지 비율 */
    caption   : captionOf(n),
    note      : noteOf(n),
  }));

  /* 종합 소견 문장. 실제 서비스에서는 AI 가 통째로 써서 내려줍니다. */
  const pick  = lv => nutrients.filter(n => lv.includes(n.level));
  const over  = pick(['over']), near = pick(['near']),
        low   = pick(['low','none']), met = pick(['met']);
  const names = list => {
    const a = list.map(x => x.name);
    return a.length > 3 ? `${a.slice(0, 3).join(', ')} 외 ${a.length - 3}개` : a.join(', ');
  };

  const examLine = m.exam.filled ? `건강검진 종합 판정은 '${m.exam.overall.label}' 입니다. ` : '';
  let text;
  if(!m.hasSupp){
    text = examLine + '계산할 성분이 없습니다. 영양제를 넣거나 식사 평균 추정치 계산을 켜 주세요.';
  } else {
    /* 영양제를 넣었는지 아닌지에 따라 첫 문장이 달라집니다 */
    const parts = [m.mealOnly
      ? `식사 평균 추정치를 기준으로 ${nutrients.length}개 성분을 살펴봤습니다.`
      : `등록한 ${input.products.length}개 제품${input.countMeal ? '과 식사 평균 추정치' : ''}에서 ${nutrients.length}개 성분을 확인했습니다.`];
    if(over.length) parts.push(`${eun(names(over))} 상한을 넘어 조정이 필요합니다.`);
    if(near.length) parts.push(`${eun(names(near))} 상한에 가까워 추가 섭취에 주의가 필요합니다.`);
    if(low.length)  parts.push(`${eun(names(low))} 권장량에 미치지 못합니다.`);
    if(met.length)  parts.push(`나머지 ${met.length}개 성분은 권장 범위 안에 있습니다.`);
    if(m.issues.length) parts.push(`점검에서 ${m.issues.length}건이 확인됐습니다.`);
    text = examLine + parts.join(' ');
  }

  const chips = [];
  if(over.length) chips.push({text:`상한 초과 ${over.length}`, tone:'red'});
  if(near.length) chips.push({text:`상한 근접 ${near.length}`, tone:'orange'});
  if(met.length)  chips.push({text:`적정 ${met.length}`,      tone:'green'});
  if(low.length)  chips.push({text:`부족 ${low.length}`,      tone:'blue'});
  if(!chips.length) chips.push({text:'데이터 없음', tone:'gray'});

  /* 헤더 요약 배지 */
  const badges = [];
  if(m.exam.filled)        badges.push({text:m.exam.overall.label, tone:m.exam.overall.tone});
  if(input.meds.length)    badges.push({text:`복약 ${input.meds.length}건`,     tone:'orange'});
  if(input.products.length)badges.push({text:`영양제 ${input.products.length}종`, tone:'green'});
  else if(m.hasSupp)       badges.push({text:'식사 기준', tone:'gray'});
  if(m.worst === 'over')   badges.push({text:'성분 상한 초과', tone:'red'});
  if(m.recommend.items.length) badges.push({text:`보충 권장 ${m.recommend.items.length}`, tone:'blue'});
  if(!badges.length)       badges.push({text:'입력 대기', tone:'gray'});

  return {
    meta: {
      generatedAt: new Date().toISOString(),
      source     : 'mock',
      engine     : '브라우저 임시 계산 (예시 기준값)',
    },
    input,
    hasSupp : m.hasSupp,
    mealOnly: m.mealOnly,
    cols    : m.cols,
    worst   : m.worst,
    badges,
    exam    : m.exam,
    nutrients,
    issues  : m.issues,
    recommend: m.recommend,
    summary : {text, chips},
  };
}
