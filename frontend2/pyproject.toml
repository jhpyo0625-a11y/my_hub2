[project]
name = "myherb-frontend2"
version = "0.1.0"
description = "MyHerb — 영양제 섭취 리포트. 화면 + 로컬 서버."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

# 이 폴더는 라이브러리가 아니라 '실행하는 것' 입니다. 설치 대상이 아니라고
# 알려 주면 uv 가 빌드를 시도하지 않고 의존성만 맞춰 줍니다.
[tool.uv]
package = false
