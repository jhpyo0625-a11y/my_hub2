# Nutrient profiles — curated layer over KDRI 2025 vendor data.
#
# diet_baseline_pct: fraction of the RI/AI target already supplied by the
#   average Korean diet. Every value MUST cite a specific KNHANES table+year.
#   Where no sourced figure exists it is null with source "none": the engine
#   then returns UNKNOWN and emits no number, rather than guessing a baseline
#   and systematically over-recommending. Filling these in is the pre-launch
#   KNHANES sourcing pass (PLAN.md open question 1).
#
# forms: present only where a supplement form changes elemental content or the
#   target/limit unit. Nutrients sold as the nutrient itself omit forms and the
#   label value is treated as elemental. Every elemental_pct is cited by the
#   compound's molecular weight.

# ── minerals ────────────────────────────────────────────────────────────

magnesium:
  target_unit: mg
  ul_unit: mg
  diet_baseline_pct: null
  diet_baseline_source: none
  forms:
    - name_ko: 산화마그네슘
      elemental_pct: 0.603
      source: "MgO 분자량 40.30, 원소 Mg 24.31 → 24.31/40.30"
    - name_ko: 구연산마그네슘
      elemental_pct: 0.161
      source: "구연산마그네슘(무수) 분자량 기준 원소 Mg 비율"
    - name_ko: 마그네슘 비스글리시네이트
